<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 760">
  <title id="title">Common logical storage substrate</title>
  <desc id="desc">A common NAMRBD logical storage substrate diagram showing request splitting, allocation entry resolution, zero short-circuit reads, data physical references, write merge, and metadata commit visibility.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#0b6b8f"/></marker>
    <marker id="grayarrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#596574"/></marker>
    <style>
      .canvas{fill:#fbfcfd}.lane{fill:#f4f8fb;stroke:#d8e0e8;stroke-width:1.5}.host{fill:#eef6ee;stroke:#9cc39d;stroke-width:2}.logical{fill:#e9f5f8;stroke:#86bac9;stroke-width:2}.meta{fill:#fff7e8;stroke:#dfb86f;stroke-width:2}.zero{fill:#f7f8fb;stroke:#aebdcc;stroke-width:1.8}.data{fill:#fff;stroke:#cbd6df;stroke-width:1.8}.write{fill:#fff2ed;stroke:#d7a28d;stroke-width:1.8}.backend{fill:#edf1fb;stroke:#9cafd8;stroke-width:1.8}.title{fill:#17202a;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#596574;font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.micro{fill:#596574;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#17202a;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arrow{fill:none;stroke:#0b6b8f;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#596574;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#grayarrow)}
    </style>
  </defs>

  <rect class="canvas" width="1280" height="760" rx="18"/>
  <text class="title" x="44" y="48">Common Logical Storage Substrate</text>
  <text class="small" x="44" y="76">Replicated and EC volumes share this logic before payload work reaches backend-specific code.</text>

  <rect class="lane" x="40" y="108" width="1200" height="148" rx="14"/>
  <text class="micro" x="66" y="140">1. Normalize host I/O into logical spans</text>
  <rect class="host" x="78" y="164" width="194" height="62" rx="8"/>
  <text class="label" x="102" y="189">Host I/O</text>
  <text class="micro" x="102" y="208">offset, length, op</text>
  <rect class="logical" x="346" y="164" width="218" height="62" rx="8"/>
  <text class="label" x="370" y="189">Geometry splitter</text>
  <text class="micro" x="370" y="208">page, chunk, boundary</text>
  <rect class="logical" x="638" y="164" width="228" height="62" rx="8"/>
  <text class="label" x="662" y="189">Read view selector</text>
  <text class="micro" x="662" y="208">live, snapshot, clone</text>
  <rect class="meta" x="940" y="164" width="230" height="62" rx="8"/>
  <text class="label" x="964" y="189">Allocation page read</text>
  <text class="micro" x="964" y="208">committed AE records</text>
  <path class="arrow" d="M272 195 H346"/>
  <path class="arrow" d="M564 195 H638"/>
  <path class="arrow" d="M866 195 H940"/>

  <rect class="lane" x="40" y="292" width="1200" height="254" rx="14"/>
  <text class="micro" x="66" y="324">2. Resolve each AllocationEntry</text>
  <rect class="meta" x="72" y="364" width="278" height="136" rx="10"/>
  <text class="label" x="98" y="392">AllocationEntry table</text>
  <rect class="zero" x="98" y="414" width="54" height="54" rx="7"/>
  <text class="micro" x="112" y="438">AE0</text>
  <text class="micro" x="110" y="456">ZERO</text>
  <rect class="data" x="162" y="414" width="54" height="54" rx="7"/>
  <text class="micro" x="176" y="438">AE1</text>
  <text class="micro" x="176" y="456">DATA</text>
  <rect class="data" x="226" y="414" width="54" height="54" rx="7"/>
  <text class="micro" x="240" y="438">AE2</text>
  <text class="micro" x="238" y="456">SHR</text>
  <rect class="zero" x="290" y="414" width="36" height="54" rx="7"/>
  <text class="micro" x="300" y="438">...</text>

  <rect class="zero" x="438" y="330" width="224" height="78" rx="9"/>
  <text class="label" x="464" y="362">AE.kind = ZERO</text>
  <text class="micro" x="464" y="382">fill response with zeroes</text>
  <rect class="data" x="438" y="450" width="224" height="78" rx="9"/>
  <text class="label" x="464" y="482">AE.kind = DATA</text>
  <text class="micro" x="464" y="502">use physical_ref only</text>
  <rect class="backend" x="748" y="450" width="222" height="78" rx="9"/>
  <text class="label" x="772" y="482">PhysicalObjectRef</text>
  <text class="micro" x="772" y="502">backend-neutral identity</text>
  <rect class="backend" x="1038" y="450" width="150" height="78" rx="9"/>
  <text class="label" x="1062" y="482">Backend</text>
  <text class="micro" x="1062" y="502">replica or EC</text>
  <path class="arrow" d="M350 418 H396 V369 H438"/>
  <path class="arrow" d="M350 446 H396 V489 H438"/>
  <path class="arrow" d="M662 489 H748"/>
  <path class="arrow" d="M970 489 H1038"/>
  <text class="small" x="746" y="374">Zero path never touches sbs-data.</text>
  <text class="small" x="746" y="398">Data path starts only after metadata resolution.</text>

  <rect class="lane" x="40" y="582" width="1200" height="122" rx="14"/>
  <text class="micro" x="66" y="614">3. Write publication rule</text>
  <rect class="write" x="86" y="632" width="238" height="56" rx="8"/>
  <text class="label" x="108" y="656">partial write</text>
  <text class="micro" x="108" y="674">merge old data if needed</text>
  <rect class="write" x="396" y="638" width="204" height="44" rx="8"/>
  <text class="label" x="424" y="666">all-zero result -> ZERO</text>
  <rect class="data" x="672" y="638" width="214" height="44" rx="8"/>
  <text class="label" x="700" y="666">new physical_ref, gen+1</text>
  <rect class="meta" x="958" y="638" width="210" height="44" rx="8"/>
  <text class="label" x="986" y="666">commit AE metadata</text>
  <path class="arrow" d="M324 660 H396"/>
  <path class="arrow" d="M600 660 H672"/>
  <path class="arrow" d="M886 660 H958"/>
</svg>
