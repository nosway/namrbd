<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 620">
  <title id="title">NAMRBD component ownership</title>
  <desc id="desc">A component ownership diagram showing host-local control, gateway edge adaptation, SBS authority, node-local execution, and metadata stores.</desc>
  <defs>
    <marker id="arrow-solid" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#0b6b8f"/></marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#596574"/></marker>
    <style>
      .canvas{fill:#fbfcfd}.band{fill:#f4f8fb;stroke:#d8e0e8;stroke-width:1.5}.box{fill:#fff;stroke:#d8e0e8;stroke-width:1.8}.host{fill:#e9f5f8;stroke:#9bc6d4;stroke-width:1.9}.edge{fill:#fff7e8;stroke:#e0c089;stroke-width:1.9}.store{fill:#f7f8fb;stroke:#cbd6df;stroke-width:1.9}.title{fill:#17202a;font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#596574;font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#596574;font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.solid{fill:none;stroke:#0b6b8f;stroke-width:3;marker-end:url(#arrow-solid)}.dash{fill:none;stroke:#596574;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="620" rx="16"/>
  <text class="title" x="42" y="48">Component Ownership Is Not The Same As Dependency</text>
  <text class="small" x="42" y="74">Calls and cached views do not transfer authority; each state class has one owning layer.</text>

  <rect class="band" x="34" y="112" width="1132" height="360" rx="12"/>
  <rect class="host" x="78" y="178" width="210" height="96" rx="9"/>
  <text class="title" x="102" y="212">Host tooling</text>
  <text class="small" x="102" y="236">namrbdctl / CSI</text>
  <text class="small" x="102" y="258">requests operations</text>

  <rect class="host" x="78" y="322" width="210" height="96" rx="9"/>
  <text class="title" x="102" y="356">Kernel local</text>
  <text class="small" x="102" y="380">device, queues, paths</text>
  <text class="small" x="102" y="402">host-only state</text>

  <rect class="edge" x="370" y="250" width="210" height="96" rx="9"/>
  <text class="title" x="394" y="284">Gateway edge</text>
  <text class="small" x="394" y="308">admit, route, report</text>
  <text class="small" x="394" y="330">cache only</text>

  <rect class="box" x="662" y="250" width="210" height="96" rx="9"/>
  <text class="title" x="686" y="284">SBS authority</text>
  <text class="small" x="686" y="308">volume, placement</text>
  <text class="small" x="686" y="330">snapshot, GC</text>

  <rect class="box" x="954" y="250" width="170" height="96" rx="9"/>
  <text class="title" x="982" y="284">sbs-data</text>
  <text class="small" x="982" y="308">local execution</text>
  <text class="small" x="982" y="330">payload ops</text>

  <path class="solid" d="M288 226 C322 226 334 298 370 298"/>
  <path class="solid" d="M288 370 C322 370 334 298 370 298"/>
  <path class="solid" d="M580 298 H662"/>
  <path class="solid" d="M872 298 H954"/>

  <rect class="store" x="198" y="508" width="190" height="64" rx="9"/>
  <text class="title" x="224" y="536">etcd</text>
  <text class="small" x="224" y="556">host/gateway control</text>
  <rect class="store" x="504" y="508" width="190" height="64" rx="9"/>
  <text class="title" x="530" y="536">TiKV</text>
  <text class="small" x="530" y="556">SBS metadata</text>
  <rect class="store" x="810" y="508" width="190" height="64" rx="9"/>
  <text class="title" x="836" y="536">Pebble</text>
  <text class="small" x="836" y="556">node-local payload</text>

  <path class="dash" d="M475 346 V508"/>
  <path class="dash" d="M767 346 V508"/>
  <path class="dash" d="M1039 346 C1039 450 905 450 905 508"/>

</svg>
