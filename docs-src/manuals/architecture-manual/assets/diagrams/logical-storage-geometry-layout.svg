<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 760">
  <title id="title">Logical storage geometry layout</title>
  <desc id="desc">A NAMRBD logical storage geometry diagram showing a volume address space split into placement extents, allocation chunks, allocation entries, and 4 KiB request normalization.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#0b6b8f"/></marker>
    <marker id="smallarrow" markerWidth="6" markerHeight="6" refX="5.1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6z" fill="#0b6b8f"/></marker>
    <style>
      .canvas{fill:#fbfcfd}.band{fill:#f4f8fb;stroke:#d8e0e8;stroke-width:1.5}.extent{fill:#e9f5f8;stroke:#86bac9;stroke-width:2}.extent2{fill:#eef6ee;stroke:#9cc39d;stroke-width:2}.chunk{fill:#fff;stroke:#cbd6df;stroke-width:1.7}.zero{fill:#f7f8fb;stroke:#aebdcc;stroke-width:1.8}.data{fill:#fff7e8;stroke:#dfb86f;stroke-width:1.8}.calc{fill:#fff;stroke:#d8e0e8;stroke-width:1.7}.warn{fill:#fff2ed;stroke:#d7a28d;stroke-width:1.8}.title{fill:#17202a;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#596574;font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.micro{fill:#596574;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#17202a;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.axis{stroke:#596574;stroke-width:2}.arrow{fill:none;stroke:#0b6b8f;stroke-width:3;marker-end:url(#arrow)}.arrow-small{fill:none;stroke:#0b6b8f;stroke-width:2.4;marker-end:url(#smallarrow)}
    </style>
  </defs>

  <rect class="canvas" width="1280" height="760" rx="18"/>
  <text class="title" x="44" y="48">Logical Storage Geometry Layout</text>
  <text class="small" x="44" y="76">Placement extents choose routing and failure-domain policy; allocation chunks carry ZERO/DATA state.</text>

  <rect class="band" x="40" y="108" width="1200" height="230" rx="14"/>
  <text class="micro" x="66" y="140">Volume logical address space</text>
  <line class="axis" x1="78" y1="176" x2="1194" y2="176"/>
  <text class="micro" x="70" y="164">0B</text>
  <text class="micro" x="1152" y="164">... end</text>

  <rect class="extent" x="78" y="194" width="760" height="92" rx="10"/>
  <text class="label" x="298" y="222">Placement Extent 0</text>
  <text class="micro" x="330" y="244">64 MiB baseline, configurable</text>
  <rect class="extent2" x="858" y="194" width="280" height="92" rx="10"/>
  <text class="label" x="930" y="222">Extent 1</text>
  <text class="micro" x="918" y="244">next routing range</text>

  <rect class="zero" x="100" y="262" width="116" height="54" rx="7"/>
  <text class="label" x="124" y="284">AE0</text>
  <text class="micro" x="120" y="302">ZERO</text>
  <rect class="data" x="226" y="262" width="116" height="54" rx="7"/>
  <text class="label" x="250" y="284">AE1</text>
  <text class="micro" x="248" y="302">DATA</text>
  <rect class="data" x="352" y="262" width="116" height="54" rx="7"/>
  <text class="label" x="376" y="284">AE2</text>
  <text class="micro" x="374" y="302">DATA</text>
  <rect class="zero" x="478" y="262" width="116" height="54" rx="7"/>
  <text class="label" x="502" y="284">AE3</text>
  <text class="micro" x="498" y="302">ZERO</text>
  <rect class="chunk" x="604" y="262" width="116" height="54" rx="7"/>
  <text class="label" x="628" y="284">...</text>
  <text class="micro" x="628" y="302">chunks</text>
  <rect class="data" x="730" y="262" width="86" height="54" rx="7"/>
  <text class="label" x="752" y="284">AEk</text>
  <text class="micro" x="748" y="302">DATA</text>
  <rect class="chunk" x="884" y="262" width="104" height="54" rx="7"/>
  <text class="label" x="908" y="284">AE</text>
  <text class="micro" x="908" y="302">state</text>
  <rect class="chunk" x="998" y="262" width="104" height="54" rx="7"/>
  <text class="label" x="1022" y="284">AE</text>
  <text class="micro" x="1022" y="302">state</text>

  <rect class="band" x="40" y="374" width="558" height="318" rx="14"/>
  <text class="micro" x="66" y="406">Request normalization for a 4 KiB block I/O</text>
  <rect class="calc" x="72" y="500" width="190" height="58" rx="8"/>
  <text class="label" x="94" y="524">logical offset off</text>
  <text class="micro" x="94" y="542">host request byte range</text>
  <rect class="calc" x="360" y="420" width="214" height="58" rx="8"/>
  <text class="label" x="382" y="444">extent_index</text>
  <text class="micro" x="382" y="462">off / extent_size</text>
  <rect class="calc" x="360" y="500" width="214" height="58" rx="8"/>
  <text class="label" x="382" y="524">alloc_chunk_index</text>
  <text class="micro" x="382" y="542">offset_in_extent / chunk_size</text>
  <rect class="calc" x="360" y="580" width="214" height="58" rx="8"/>
  <text class="label" x="382" y="604">block_index</text>
  <text class="micro" x="382" y="622">offset_in_chunk / 4 KiB</text>
  <path class="arrow-small" d="M262 514 H318 V449 H360"/>
  <path class="arrow-small" d="M262 529 H360"/>
  <path class="arrow-small" d="M262 544 H318 V609 H360"/>

  <rect class="band" x="638" y="374" width="602" height="318" rx="14"/>
  <text class="micro" x="664" y="406">When a request crosses allocation chunk boundaries</text>
  <rect class="chunk" x="684" y="454" width="224" height="78" rx="8"/>
  <text class="label" x="746" y="486">AllocChunk i</text>
  <text class="micro" x="742" y="506">chunk_size_bytes</text>
  <rect class="chunk" x="932" y="454" width="224" height="78" rx="8"/>
  <text class="label" x="988" y="486">AllocChunk i+1</text>
  <text class="micro" x="990" y="506">next chunk</text>
  <rect class="warn" x="858" y="424" width="168" height="40" rx="7"/>
  <text class="label" x="904" y="449">4 KiB I/O</text>
  <line class="axis" x1="920" y1="454" x2="920" y2="532"/>
  <rect class="warn" x="858" y="488" width="50" height="28" rx="5"/>
  <rect class="warn" x="932" y="488" width="50" height="28" rx="5"/>
  <path class="arrow-small" d="M884 464 V488"/>
  <path class="arrow-small" d="M960 464 V488"/>
  <text class="micro" x="850" y="552">tail sub-IO</text>
  <text class="micro" x="936" y="552">head sub-IO</text>
  <rect class="calc" x="692" y="606" width="440" height="48" rx="8"/>
  <text class="label" x="722" y="636">Split first, then resolve each AE as ZERO or DATA</text>

  <text class="small" x="64" y="724">Key point: ZERO is metadata state, DATA uses physical_ref, and generation protects overwrite and GC ordering.</text>
</svg>
