services:
  etcd:
    image: ${NAMRBD_ETCD_IMAGE:-gcr.io/etcd-development/etcd}:${NAMRBD_ETCD_TAG:-v3.6.8}
    command:
      - /usr/local/bin/etcd
      - --name=namrbd-quickstart-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  sbs-data:
    image: ${NAMRBD_SBS_DATA_IMAGE:-ghcr.io/nosway/namrbd-sbs-data}:${NAMRBD_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.sbs
      target: sbs-data
    command:
      - --path=/var/lib/namrbd/sbs-data
      - --grpc-listen=0.0.0.0:9444
      - --http-listen=0.0.0.0:9082
    ports:
      - ${NAMRBD_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${NAMRBD_QUICKSTART_SBS_DATA_GRPC_PORT:-19551}:9444
      - ${NAMRBD_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${NAMRBD_QUICKSTART_SBS_DATA_HTTP_PORT:-19082}:9082
    volumes:
      - sbs-data:/var/lib/namrbd/sbs-data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9082/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  sbs-service:
    image: ${NAMRBD_SBS_SERVICE_IMAGE:-ghcr.io/nosway/namrbd-sbs-service}:${NAMRBD_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.sbs
      target: sbs-service
    command:
      - --cluster-id=${NAMRBD_QUICKSTART_CLUSTER_ID:-namrbd-quickstart}
      - --sbs-cluster-id=${NAMRBD_QUICKSTART_SBS_CLUSTER_ID:-sbs-quickstart}
      - --node-id=${NAMRBD_QUICKSTART_SERVICE_NODE_ID:-sbs-service-1}
      - --metadata-backend=pebble
      - --metadata-path=/var/lib/namrbd/sbs-meta
      - --payload-root=/var/lib/namrbd/sbs-payload
      - --leader-lease-duration=5s
      - --leader-renew-interval=1s
      - --grpc-listen=0.0.0.0:9443
      - --http-listen=0.0.0.0:9081
    depends_on:
      sbs-data:
        condition: service_healthy
    ports:
      - ${NAMRBD_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${NAMRBD_QUICKSTART_SBS_ADMIN_GRPC_PORT:-19443}:9443
      - ${NAMRBD_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${NAMRBD_QUICKSTART_SBS_ADMIN_HTTP_PORT:-19081}:9081
    volumes:
      - sbs-service-meta:/var/lib/namrbd/sbs-meta
      - sbs-service-payload:/var/lib/namrbd/sbs-payload
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9081/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  sbsctl:
    image: ${NAMRBD_SBSCTL_IMAGE:-ghcr.io/nosway/namrbd-sbsctl}:${NAMRBD_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.sbs
      target: sbsctl
    entrypoint: ["/usr/local/bin/sbsctl"]
    command: ["--help"]
    environment:
      NAMRBD_CLUSTER_ID: ${NAMRBD_QUICKSTART_CLUSTER_ID:-namrbd-quickstart}
      NAMRBD_SBS_CLUSTER_ID: ${NAMRBD_QUICKSTART_SBS_CLUSTER_ID:-sbs-quickstart}
      NAMRBD_SBS_ADMIN_ENDPOINTS: sbs-service:9443
      SBS_ADMIN_ENDPOINTS: sbs-service:9443
      SBS_DATA_ENDPOINTS: sbs-data:9444
    depends_on:
      sbs-service:
        condition: service_healthy

  namrbd-gateway:
    image: ${NAMRBD_GATEWAY_IMAGE:-ghcr.io/nosway/namrbd-gateway}:${NAMRBD_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.sbs
      target: namrbd-gateway
    command:
      - --listen=0.0.0.0:9701
      - --data-listen=0.0.0.0:9700
      - --advertise-control-address=${NAMRBD_QUICKSTART_GATEWAY_ADVERTISE_ADDRESS:-namrbd-gateway}
      - --advertise-data-address=${NAMRBD_QUICKSTART_GATEWAY_ADVERTISE_ADDRESS:-namrbd-gateway}
      - --metadata-backend=etcd
      - --etcd-endpoints=etcd:2379
      - --etcd-root=/namrbd/quickstart
      - --data-backend-mode=sbs-cluster
      - --sbs-admin-endpoint=sbs-service:9443
      - --gateway-id=${NAMRBD_QUICKSTART_GATEWAY_ID:-quickstart-gateway}
    depends_on:
      etcd:
        condition: service_healthy
      sbs-service:
        condition: service_healthy
    ports:
      - ${NAMRBD_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${NAMRBD_QUICKSTART_GATEWAY_HTTP_PORT:-19701}:9701
      - ${NAMRBD_QUICKSTART_BIND_ADDRESS:-127.0.0.1}:${NAMRBD_QUICKSTART_GATEWAY_DATA_PORT:-19700}:9700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9701/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  etcd-data:
  sbs-data:
  sbs-service-meta:
  sbs-service-payload:
