  rpc GetISCSIInitiatorACL(GetISCSIInitiatorACLRequest) returns (GetISCSIInitiatorACLResponse);
  rpc ListISCSISessions(ListISCSISessionsRequest) returns (ListISCSISessionsResponse);
  rpc GetISCSISession(GetISCSISessionRequest) returns (GetISCSISessionResponse);
  rpc RecordISCSISession(RecordISCSISessionRequest) returns (RecordISCSISessionResponse);
  rpc DisconnectISCSISession(DisconnectISCSISessionRequest) returns (DisconnectISCSISessionResponse);
  rpc GetISCSIFailover(GetISCSIFailoverRequest) returns (GetISCSIFailoverResponse);
  rpc PromoteISCSIFailover(PromoteISCSIFailoverRequest) returns (PromoteISCSIFailoverResponse);
  rpc DemoteISCSIFailover(DemoteISCSIFailoverRequest) returns (DemoteISCSIFailoverResponse);
  rpc StandbyISCSIFailover(StandbyISCSIFailoverRequest) returns (StandbyISCSIFailoverResponse);
  rpc RevokeStaleISCSIFailover(RevokeStaleISCSIFailoverRequest) returns (RevokeStaleISCSIFailoverResponse);
  rpc CreateISCSIPortal(CreateISCSIPortalRequest) returns (CreateISCSIPortalResponse);
  rpc DeleteISCSIPortal(DeleteISCSIPortalRequest) returns (DeleteISCSIPortalResponse);
  rpc SetISCSIPortalEnabled(SetISCSIPortalEnabledRequest) returns (SetISCSIPortalEnabledResponse);
  rpc CreateISCSITarget(CreateISCSITargetRequest) returns (CreateISCSITargetResponse);
  rpc DeleteISCSITarget(DeleteISCSITargetRequest) returns (DeleteISCSITargetResponse);
  rpc SetISCSITargetEnabled(SetISCSITargetEnabledRequest) returns (SetISCSITargetEnabledResponse);
  rpc ExportISCSILUN(ExportISCSILUNRequest) returns (ExportISCSILUNResponse);
  rpc UnexportISCSILUN(UnexportISCSILUNRequest) returns (UnexportISCSILUNResponse);
  rpc SetISCSILUNMode(SetISCSILUNModeRequest) returns (SetISCSILUNModeResponse);
  rpc AllowISCSIInitiator(AllowISCSIInitiatorRequest) returns (AllowISCSIInitiatorResponse);
  rpc DenyISCSIInitiator(DenyISCSIInitiatorRequest) returns (DenyISCSIInitiatorResponse);
  rpc SetISCSIInitiatorAuth(SetISCSIInitiatorAuthRequest) returns (SetISCSIInitiatorAuthResponse);
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc CreateVolumeFromSnapshot(CreateVolumeFromSnapshotRequest) returns (CreateVolumeFromSnapshotResponse);
  rpc ExpandVolume(ExpandVolumeRequest) returns (ExpandVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc PurgeVolume(PurgeVolumeRequest) returns (PurgeVolumeResponse);
  rpc PlanVolumeRepack(PlanVolumeRepackRequest) returns (PlanVolumeRepackResponse);
  rpc StartVolumeRepack(StartVolumeRepackRequest) returns (StartVolumeRepackResponse);
  rpc GetVolumeRepack(GetVolumeRepackRequest) returns (GetVolumeRepackResponse);
  rpc ListVolumeRepacks(ListVolumeRepacksRequest) returns (ListVolumeRepacksResponse);
  rpc CancelVolumeRepack(CancelVolumeRepackRequest) returns (CancelVolumeRepackResponse);
  rpc PlanDedupe(PlanDedupeRequest) returns (PlanDedupeResponse);
  rpc StartDedupe(StartDedupeRequest) returns (StartDedupeResponse);

  rpc CreateSecurityProvider(CreateSecurityProviderRequest) returns (CreateSecurityProviderResponse);
  rpc GetSecurityProvider(GetSecurityProviderRequest) returns (GetSecurityProviderResponse);
  rpc ListSecurityProviders(ListSecurityProvidersRequest) returns (ListSecurityProvidersResponse);
  rpc CheckSecurityProvider(CheckSecurityProviderRequest) returns (CheckSecurityProviderResponse);
  rpc CreateSecurityPolicy(CreateSecurityPolicyRequest) returns (CreateSecurityPolicyResponse);
  rpc GetSecurityPolicy(GetSecurityPolicyRequest) returns (GetSecurityPolicyResponse);
  rpc ListSecurityPolicies(ListSecurityPoliciesRequest) returns (ListSecurityPoliciesResponse);
  rpc BindSecurityPolicy(BindSecurityPolicyRequest) returns (BindSecurityPolicyResponse);
  rpc CreateSecurityDataKey(CreateSecurityDataKeyRequest) returns (CreateSecurityDataKeyResponse);
  rpc GetSecurityDataKey(GetSecurityDataKeyRequest) returns (GetSecurityDataKeyResponse);
  rpc ListSecurityDataKeys(ListSecurityDataKeysRequest) returns (ListSecurityDataKeysResponse);
  rpc DisableSecurityDataKey(DisableSecurityDataKeyRequest) returns (DisableSecurityDataKeyResponse);
  rpc EnableSecurityDataKey(EnableSecurityDataKeyRequest) returns (EnableSecurityDataKeyResponse);
  rpc PlanSecurityDataKeyDestroy(PlanSecurityDataKeyDestroyRequest) returns (PlanSecurityDataKeyDestroyResponse);
  rpc DestroySecurityDataKey(DestroySecurityDataKeyRequest) returns (DestroySecurityDataKeyResponse);
  rpc CreateSecurityKeyRotationPlan(CreateSecurityKeyRotationPlanRequest) returns (CreateSecurityKeyRotationPlanResponse);
  rpc GetSecurityKeyRotationPlan(GetSecurityKeyRotationPlanRequest) returns (GetSecurityKeyRotationPlanResponse);
  rpc ListSecurityKeyRotationPlans(ListSecurityKeyRotationPlansRequest) returns (ListSecurityKeyRotationPlansResponse);
  rpc RunSecurityKeyRotation(RunSecurityKeyRotationRequest) returns (RunSecurityKeyRotationResponse);
  rpc CreateSecurityCryptoErasePlan(CreateSecurityCryptoErasePlanRequest) returns (CreateSecurityCryptoErasePlanResponse);
  rpc GetSecurityCryptoErasePlan(GetSecurityCryptoErasePlanRequest) returns (GetSecurityCryptoErasePlanResponse);
  rpc ListSecurityCryptoErasePlans(ListSecurityCryptoErasePlansRequest) returns (ListSecurityCryptoErasePlansResponse);
  rpc RunSecurityCryptoErase(RunSecurityCryptoEraseRequest) returns (RunSecurityCryptoEraseResponse);
