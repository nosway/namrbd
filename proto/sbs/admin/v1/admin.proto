syntax = "proto3";

package sbs.admin.v1;

option go_package = "github.com/nosway/namrbd/sbs/admin/v1;adminv1";

import "google/protobuf/timestamp.proto";

service AdminService {
  rpc ClusterInit(ClusterInitRequest) returns (ClusterInitResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetMembershipProjectionStatus(GetMembershipProjectionStatusRequest) returns (GetMembershipProjectionStatusResponse);
  rpc RebuildMembershipProjection(RebuildMembershipProjectionRequest) returns (RebuildMembershipProjectionResponse);
