  rpc UpdateNodeRegistration(UpdateNodeRegistrationRequest) returns (UpdateNodeRegistrationResponse);
  rpc LeaveNode(LeaveNodeRequest) returns (LeaveNodeResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc ForceRemoveNode(ForceRemoveNodeRequest) returns (ForceRemoveNodeResponse);

  rpc CreateTopologyZone(CreateTopologyZoneRequest) returns (CreateTopologyZoneResponse);
  rpc ListTopologyZones(ListTopologyZonesRequest) returns (ListTopologyZonesResponse);
  rpc GetTopologyZone(GetTopologyZoneRequest) returns (GetTopologyZoneResponse);
  rpc UpdateTopologyZone(UpdateTopologyZoneRequest) returns (UpdateTopologyZoneResponse);
  rpc DeleteTopologyZone(DeleteTopologyZoneRequest) returns (DeleteTopologyZoneResponse);

  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc GetVolumePlacementView(GetVolumePlacementViewRequest) returns (GetVolumePlacementViewResponse);
  rpc GetVolumeAllocationPageView(GetVolumeAllocationPageViewRequest) returns (GetVolumeAllocationPageViewResponse);
  rpc GetReplicaTargetsView(GetReplicaTargetsViewRequest) returns (GetReplicaTargetsViewResponse);
  rpc GetISCSIRegistry(GetISCSIRegistryRequest) returns (GetISCSIRegistryResponse);
  rpc ListISCSIPortals(ListISCSIPortalsRequest) returns (ListISCSIPortalsResponse);
  rpc GetISCSIPortal(GetISCSIPortalRequest) returns (GetISCSIPortalResponse);
  rpc ListISCSITargets(ListISCSITargetsRequest) returns (ListISCSITargetsResponse);
  rpc GetISCSITarget(GetISCSITargetRequest) returns (GetISCSITargetResponse);
  rpc ListISCSILUNs(ListISCSILUNsRequest) returns (ListISCSILUNsResponse);
  rpc GetISCSILUN(GetISCSILUNRequest) returns (GetISCSILUNResponse);
  rpc ListISCSIExports(ListISCSIExportsRequest) returns (ListISCSIExportsResponse);
  rpc GetISCSIExport(GetISCSIExportRequest) returns (GetISCSIExportResponse);
  rpc GetISCSIRegistryChanges(GetISCSIRegistryChangesRequest) returns (GetISCSIRegistryChangesResponse);
