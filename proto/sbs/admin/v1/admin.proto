  rpc CheckSecurityDataKeyAccess(CheckSecurityDataKeyAccessRequest) returns (CheckSecurityDataKeyAccessResponse);
  rpc UnwrapSecurityDataKey(UnwrapSecurityDataKeyRequest) returns (UnwrapSecurityDataKeyResponse);
  rpc GetKeyAccessLease(GetKeyAccessLeaseRequest) returns (GetKeyAccessLeaseResponse);
  rpc RevokeKeyAccessLease(RevokeKeyAccessLeaseRequest) returns (RevokeKeyAccessLeaseResponse);
  rpc ListSecurityAuditEvents(ListSecurityAuditEventsRequest) returns (ListSecurityAuditEventsResponse);
  rpc VerifySecurityAuditLog(VerifySecurityAuditLogRequest) returns (VerifySecurityAuditLogResponse);

  rpc CreateECProfile(CreateECProfileRequest) returns (CreateECProfileResponse);
  rpc ListECProfiles(ListECProfilesRequest) returns (ListECProfilesResponse);
  rpc GetECProfile(GetECProfileRequest) returns (GetECProfileResponse);
  rpc DisableECProfile(DisableECProfileRequest) returns (DisableECProfileResponse);

  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc CreateClone(CreateCloneRequest) returns (CreateCloneResponse);
  rpc GetClone(GetCloneRequest) returns (GetCloneResponse);
  rpc ListClones(ListClonesRequest) returns (ListClonesResponse);
  rpc MaterializeClone(MaterializeCloneRequest) returns (MaterializeCloneResponse);
  rpc DeleteClone(DeleteCloneRequest) returns (DeleteCloneResponse);

  rpc UpdateNodeStoreWeights(UpdateNodeStoreWeightsRequest) returns (UpdateNodeStoreWeightsResponse);
  rpc UpdateNodeStoreTuning(UpdateNodeStoreTuningRequest) returns (UpdateNodeStoreTuningResponse);

  rpc GetMaintenanceStatus(GetMaintenanceStatusRequest) returns (GetMaintenanceStatusResponse);
  rpc SetBackgroundBudget(SetBackgroundBudgetRequest) returns (SetBackgroundBudgetResponse);
  rpc AcquireBudgetLease(AcquireBudgetLeaseRequest) returns (AcquireBudgetLeaseResponse);
  rpc GetBudgetLease(GetBudgetLeaseRequest) returns (GetBudgetLeaseResponse);
  rpc ListBudgetLeases(ListBudgetLeasesRequest) returns (ListBudgetLeasesResponse);
  rpc SetMaintenanceThrottle(SetMaintenanceThrottleRequest) returns (SetMaintenanceThrottleResponse);
  rpc PauseMaintenance(PauseMaintenanceRequest) returns (PauseMaintenanceResponse);
  rpc ResumeMaintenance(ResumeMaintenanceRequest) returns (ResumeMaintenanceResponse);

  rpc ListRepairs(ListRepairsRequest) returns (ListRepairsResponse);
  rpc ListRebalances(ListRebalancesRequest) returns (ListRebalancesResponse);

  rpc StartRestoreWarmup(StartRestoreWarmupRequest) returns (StartRestoreWarmupResponse);
  rpc RunRestoreWarmup(RunRestoreWarmupRequest) returns (RunRestoreWarmupResponse);
  rpc GetRestoreWarmup(GetRestoreWarmupRequest) returns (GetRestoreWarmupResponse);
  rpc ListRestoreWarmups(ListRestoreWarmupsRequest) returns (ListRestoreWarmupsResponse);
  rpc CancelRestoreWarmup(CancelRestoreWarmupRequest) returns (CancelRestoreWarmupResponse);

  rpc BuildDiffIndex(BuildDiffIndexRequest) returns (BuildDiffIndexResponse);
  rpc ScanDiffIndex(ScanDiffIndexRequest) returns (ScanDiffIndexResponse);
  rpc GetDiffIndex(GetDiffIndexRequest) returns (GetDiffIndexResponse);
  rpc ListDiffIndexes(ListDiffIndexesRequest) returns (ListDiffIndexesResponse);
  rpc DropDiffIndex(DropDiffIndexRequest) returns (DropDiffIndexResponse);
  rpc SetECJournalGuardedMode(SetECJournalGuardedModeRequest) returns (SetECJournalGuardedModeResponse);
  rpc GetECJournalGuardedMode(GetECJournalGuardedModeRequest) returns (GetECJournalGuardedModeResponse);

  rpc CreateBackupTarget(CreateBackupTargetRequest) returns (CreateBackupTargetResponse);
  rpc GetBackupTarget(GetBackupTargetRequest) returns (GetBackupTargetResponse);
  rpc ListBackupTargets(ListBackupTargetsRequest) returns (ListBackupTargetsResponse);
  rpc CreateBackupPolicy(CreateBackupPolicyRequest) returns (CreateBackupPolicyResponse);
  rpc GetBackupPolicy(GetBackupPolicyRequest) returns (GetBackupPolicyResponse);
  rpc ListBackupPolicies(ListBackupPoliciesRequest) returns (ListBackupPoliciesResponse);
  rpc StartBackupRun(StartBackupRunRequest) returns (StartBackupRunResponse);
  rpc GetBackupRun(GetBackupRunRequest) returns (GetBackupRunResponse);
  rpc ListBackupRuns(ListBackupRunsRequest) returns (ListBackupRunsResponse);
  rpc MarkBackupArtifactAvailable(MarkBackupArtifactAvailableRequest) returns (MarkBackupArtifactAvailableResponse);
  rpc GetBackupArtifact(GetBackupArtifactRequest) returns (GetBackupArtifactResponse);
  rpc ListBackupArtifacts(ListBackupArtifactsRequest) returns (ListBackupArtifactsResponse);
  rpc CreateBackupRetentionHold(CreateBackupRetentionHoldRequest) returns (CreateBackupRetentionHoldResponse);
  rpc PlanBackupPurge(PlanBackupPurgeRequest) returns (PlanBackupPurgeResponse);
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);

  rpc CreateDRReplicationLink(CreateDRReplicationLinkRequest) returns (CreateDRReplicationLinkResponse);
  rpc GetDRReplicationLink(GetDRReplicationLinkRequest) returns (GetDRReplicationLinkResponse);
  rpc ListDRReplicationLinks(ListDRReplicationLinksRequest) returns (ListDRReplicationLinksResponse);
  rpc CreateDRRecoveryPoint(CreateDRRecoveryPointRequest) returns (CreateDRRecoveryPointResponse);
  rpc GetDRRecoveryPoint(GetDRRecoveryPointRequest) returns (GetDRRecoveryPointResponse);
  rpc ListDRRecoveryPoints(ListDRRecoveryPointsRequest) returns (ListDRRecoveryPointsResponse);
  rpc CreateDRShippingManifest(CreateDRShippingManifestRequest) returns (CreateDRShippingManifestResponse);
  rpc GetDRShippingManifest(GetDRShippingManifestRequest) returns (GetDRShippingManifestResponse);
  rpc ListDRShippingManifests(ListDRShippingManifestsRequest) returns (ListDRShippingManifestsResponse);
  rpc AdmitDRShippingWorker(AdmitDRShippingWorkerRequest) returns (AdmitDRShippingWorkerResponse);
  rpc HeartbeatDRShippingWorker(HeartbeatDRShippingWorkerRequest) returns (HeartbeatDRShippingWorkerResponse);
  rpc GetDRShippingWorker(GetDRShippingWorkerRequest) returns (GetDRShippingWorkerResponse);
  rpc ListDRShippingWorkers(ListDRShippingWorkersRequest) returns (ListDRShippingWorkersResponse);
  rpc ImportDRStandbyVolume(ImportDRStandbyVolumeRequest) returns (ImportDRStandbyVolumeResponse);
  rpc GetDRStandbyVolume(GetDRStandbyVolumeRequest) returns (GetDRStandbyVolumeResponse);
  rpc ListDRStandbyVolumes(ListDRStandbyVolumesRequest) returns (ListDRStandbyVolumesResponse);
  rpc CheckDRStandbyVolumeWrite(CheckDRStandbyVolumeWriteRequest) returns (CheckDRStandbyVolumeWriteResponse);
  rpc PromoteDRStandbyVolume(PromoteDRStandbyVolumeRequest) returns (PromoteDRStandbyVolumeResponse);
  rpc DemoteDRStandbyVolume(DemoteDRStandbyVolumeRequest) returns (DemoteDRStandbyVolumeResponse);
  rpc CheckDROldPrimaryWrite(CheckDROldPrimaryWriteRequest) returns (CheckDROldPrimaryWriteResponse);
  rpc DefineDROldPrimaryRejoinPolicy(DefineDROldPrimaryRejoinPolicyRequest) returns (DefineDROldPrimaryRejoinPolicyResponse);
  rpc RunDRFailoverDrill(RunDRFailoverDrillRequest) returns (RunDRFailoverDrillResponse);
  rpc GetDRFailoverDrill(GetDRFailoverDrillRequest) returns (GetDRFailoverDrillResponse);
  rpc ListDRFailoverDrills(ListDRFailoverDrillsRequest) returns (ListDRFailoverDrillsResponse);
}

message RequestMeta {
  string request_id = 1;
  string actor = 2;
  string reason = 3;
}

message ClusterRef {
  string cluster_id = 1;
  string sbs_cluster_id = 2;
}

message ClusterInitRequest {
  ClusterRef cluster = 1;
  RequestMeta meta = 2;
}

message ClusterInitResponse {
  ClusterRef cluster = 1;
  OperationHandle operation = 2;
}

message OperationHandle {
  bool accepted = 1;
  string operation_id = 2;
  string message = 3;
}

enum QuorumHealth {
  QUORUM_HEALTH_UNSPECIFIED = 0;
  QUORUM_HEALTH_HEALTHY = 1;
  QUORUM_HEALTH_DEGRADED = 2;
  QUORUM_HEALTH_UNAVAILABLE = 3;
}

enum NodeHealth {
  NODE_HEALTH_UNSPECIFIED = 0;
  NODE_HEALTH_HEALTHY = 1;
  NODE_HEALTH_SUSPECT = 2;
  NODE_HEALTH_DOWN = 3;
}

enum NodeLifecycle {
  NODE_LIFECYCLE_UNSPECIFIED = 0;
  NODE_LIFECYCLE_JOINING = 1;
  NODE_LIFECYCLE_ACTIVE = 2;
  NODE_LIFECYCLE_DRAINING = 3;
  NODE_LIFECYCLE_REMOVED = 4;
}

enum TopologyZoneLifecycle {
  TOPOLOGY_ZONE_LIFECYCLE_UNSPECIFIED = 0;
  TOPOLOGY_ZONE_LIFECYCLE_ACTIVE = 1;
  TOPOLOGY_ZONE_LIFECYCLE_DISABLED = 2;
  TOPOLOGY_ZONE_LIFECYCLE_RETIRING = 3;
}

enum VolumeHealth {
  VOLUME_HEALTH_UNSPECIFIED = 0;
  VOLUME_HEALTH_HEALTHY = 1;
  VOLUME_HEALTH_DEGRADED = 2;
  VOLUME_HEALTH_REPAIRING = 3;
  VOLUME_HEALTH_REBALANCING = 4;
  VOLUME_HEALTH_BLOCKED = 5;
}

enum SnapshotState {
  SNAPSHOT_STATE_UNSPECIFIED = 0;
  SNAPSHOT_STATE_CREATING = 1;
  SNAPSHOT_STATE_AVAILABLE = 2;
  SNAPSHOT_STATE_DELETING = 3;
  SNAPSHOT_STATE_DELETED = 4;
  SNAPSHOT_STATE_FAILED = 5;
}

enum CloneState {
  CLONE_STATE_UNSPECIFIED = 0;
  CLONE_STATE_CREATING = 1;
  CLONE_STATE_AVAILABLE = 2;
  CLONE_STATE_DELETING = 3;
  CLONE_STATE_DELETED = 4;
  CLONE_STATE_FAILED = 5;
  CLONE_STATE_MATERIALIZING = 6;
  CLONE_STATE_MATERIALIZED = 7;
}

enum ECProfileLifecycle {
  EC_PROFILE_LIFECYCLE_UNSPECIFIED = 0;
  EC_PROFILE_LIFECYCLE_ACTIVE = 1;
  EC_PROFILE_LIFECYCLE_DISABLED = 2;
}

enum VolumeRepackState {
  VOLUME_REPACK_STATE_UNSPECIFIED = 0;
  VOLUME_REPACK_STATE_PLANNED = 1;
  VOLUME_REPACK_STATE_COPYING = 2;
  VOLUME_REPACK_STATE_VERIFYING = 3;
  VOLUME_REPACK_STATE_PUBLISH_PENDING = 4;
  VOLUME_REPACK_STATE_COMMITTED = 5;
  VOLUME_REPACK_STATE_CANCEL_REQUESTED = 6;
  VOLUME_REPACK_STATE_ROLLING_BACK = 7;
  VOLUME_REPACK_STATE_CANCELED = 8;
  VOLUME_REPACK_STATE_FAILED = 9;
}

enum VolumeLayoutKind {
  VOLUME_LAYOUT_KIND_UNSPECIFIED = 0;
  VOLUME_LAYOUT_KIND_REPLICATED = 1;
  VOLUME_LAYOUT_KIND_EC = 2;
}

enum ReplicaTargetReasonCode {
  REPLICA_TARGET_REASON_CODE_UNSPECIFIED = 0;
  REPLICA_TARGET_REASON_CODE_READY = 1;
  REPLICA_TARGET_REASON_CODE_NODE_SUSPECT = 2;
  REPLICA_TARGET_REASON_CODE_NODE_DOWN = 3;
  REPLICA_TARGET_REASON_CODE_RECOVERY_COOLDOWN = 4;
  REPLICA_TARGET_REASON_CODE_NODE_DRAINING = 5;
  REPLICA_TARGET_REASON_CODE_ENDPOINT_MISSING = 6;
  REPLICA_TARGET_REASON_CODE_BACKEND_UNAVAILABLE = 7;
}

message NodeSummary {
  reserved 7;
  reserved "rack";

  string node_id = 1;
  NodeLifecycle lifecycle = 2;
  NodeHealth health = 3;
  string grpc_endpoint = 4;
  string admin_http_endpoint = 5;
  string zone = 6;
  map<string, string> labels = 8;
  google.protobuf.Timestamp last_heartbeat_time = 9;
  google.protobuf.Timestamp last_probe_time = 10;
  string last_probe_error = 11;
  uint32 consecutive_probe_failures = 12;
  uint32 consecutive_probe_successes = 13;
  string health_reason = 14;
  string health_updated_by = 15;
  google.protobuf.Timestamp recovery_eligible_time = 16;
  string cluster_id = 17;
  string sbs_cluster_id = 18;
  repeated string store_ids = 19;
  repeated string roles = 20;
  string desired_state = 21;
  string observed_state = 22;
  uint64 generation = 23;
  uint64 membership_revision = 24;
  bool tombstone = 25;
  google.protobuf.Timestamp created_time = 26;
  google.protobuf.Timestamp updated_time = 27;
  string updated_by = 28;
  string update_reason = 29;
  string replica_id = 30;
}

message TopologyZoneSummary {
  string zone_id = 1;
  string display_name = 2;
  TopologyZoneLifecycle lifecycle = 3;
  map<string, string> labels = 4;
  google.protobuf.Timestamp created_time = 5;
  google.protobuf.Timestamp updated_time = 6;
}

message VolumeSummary {
  string volume_id = 1;
  uint64 size_bytes = 2;
  uint32 block_size = 3;
  VolumeHealth health = 4;
  uint64 volume_revision = 5;
  uint64 repair_backlog = 6;
  uint64 repair_backlog_bytes = 7;
  uint64 repair_backlog_chunks = 8;
  uint64 rebalance_backlog = 9;
  uint64 rebalance_backlog_bytes = 10;
  uint64 rebalance_backlog_chunks = 11;
  uint64 drain_backlog = 12;
  uint64 drain_backlog_bytes = 13;
  uint64 drain_backlog_chunks = 14;
  uint64 retired_payload_backlog_bytes = 15;
  uint64 retired_payload_backlog_chunks = 16;
  uint64 retired_payload_failed_batches = 17;
  uint64 retired_payload_oldest_failed_batch_age_seconds = 18;
  uint64 transition_failed_batches = 19;
  uint64 transition_oldest_failed_batch_age_seconds = 20;
  uint64 transition_recent_batches = 21;
  uint64 transition_small_batches = 22;
  uint64 transition_requeued = 23;
  uint64 transition_retry_pages = 24;
  uint64 transition_retry_windows = 25;
  uint64 transition_retry_window_bytes = 26;
  uint64 transition_retry_window_chunks = 27;
  bool maintenance_cooldown_active = 28;
  uint64 maintenance_cooldown_remaining_seconds = 29;
  uint32 chunk_size_bytes = 30;
  uint32 extent_page_bytes = 31;
  string topology_mode = 32;
  string redundancy_backend = 33;
  string ec_profile_id = 34;
  string ec_codec_id = 35;
  uint32 ec_data_shards = 36;
  uint32 ec_parity_shards = 37;
  uint32 ec_stripe_unit_bytes = 38;
  string ec_failure_domain = 39;
  bool weak_placement_allowed = 40;
  VolumeProtectedState protected_state = 41;
}

message VolumeProtectedState {
  string state = 1;
  string reason_code = 2;
  string sealed_object_id = 3;
  string seal_operation_id = 4;
  string policy_snapshot_id = 5;
  string lifecycle_state = 6;
  string source_volume_id = 7;
}

message ReplicaMemberSummary {
  string node_id = 1;
  string replica_id = 2;
  string role = 3;
  string failure_domain = 4;
}

message ReplicaSetSummary {
  string replica_set_id = 1;
  string volume_id = 2;
  string placement_ref = 3;
  uint64 epoch = 4;
  repeated ReplicaMemberSummary replicas = 5;
  string primary_replica_id = 6;
  uint32 write_quorum = 7;
  uint32 read_quorum = 8;
  repeated string failure_domains = 9;
}

message ExtentPlacementSummary {
  string volume_id = 1;
  uint64 extent_id = 2;
  uint64 logical_offset = 3;
  uint64 length_bytes = 4;
  uint64 chunk_id = 5;
  string placement_ref = 6;
  uint64 revision = 7;
}

message AllocationExtentSummary {
  uint64 logical_chunk_start = 1;
  uint32 chunk_count = 2;
  string kind = 3;
  uint64 physical_chunk_start = 4;
  string backing_ref = 5;
  uint64 generation = 6;
  string checksum = 7;
  PayloadEncryptionHeaderSummary encryption = 8;
}

message AllocationPageSummary {
  string volume_id = 1;
  uint64 page_no = 2;
  uint32 page_bytes = 3;
  uint32 chunk_size_bytes = 4;
  uint64 revision = 5;
  repeated AllocationExtentSummary extents = 6;
}

message ReplicaTargetEndpoint {
  string address = 1;
  uint32 port = 2;
  bool use_tls = 3;
  string server_name = 4;
}

message ReplicaTargetView {
  string target_id = 1;
  ReplicaTargetEndpoint endpoint = 2;
  string admin_http_endpoint = 3;
  bool usable = 4;
  uint32 priority = 5;
  ReplicaTargetReasonCode reason_code = 6;
}

message StoreWeightSummary {
  string store_id = 1;
  int32 weight = 2;
}

message StoreTuningSummary {
  string store_id = 1;
  int32 weight = 2;
  // Deprecated. Leave empty; use weight=0 to stop new allocations.
  string allocation_policy = 3;
}

message RepairSummary {
  string volume_id = 1;
  string placement_ref = 2;
  string current_replica_set_id = 3;
  string target_replica_set_id = 4;
  string state = 5;
}

message RebalanceSummary {
  string volume_id = 1;
  string placement_ref = 2;
  string current_replica_set_id = 3;
  string target_replica_set_id = 4;
  string state = 5;
}

message GetClusterStatusRequest {
  ClusterRef cluster = 1;
}

message GetClusterStatusResponse {
  ClusterRef cluster = 1;
  string leader_node_id = 2;
  QuorumHealth quorum_health = 3;
  uint32 active_nodes = 4;
  uint32 draining_nodes = 5;
  uint64 degraded_extents = 6;
  uint64 repair_backlog = 7;
  uint64 rebalance_backlog = 8;
  uint64 repair_backlog_bytes = 9;
  uint64 repair_backlog_chunks = 10;
  uint64 rebalance_backlog_bytes = 11;
  uint64 rebalance_backlog_chunks = 12;
  uint64 drain_backlog = 13;
  uint64 drain_backlog_bytes = 14;
  uint64 drain_backlog_chunks = 15;
  uint64 retired_payload_backlog_bytes = 16;
  uint64 retired_payload_backlog_chunks = 17;
  uint64 retired_payload_failed_batches = 18;
  uint64 retired_payload_oldest_failed_batch_age_seconds = 19;
  uint64 transition_failed_batches = 20;
  uint64 transition_oldest_failed_batch_age_seconds = 21;
  uint64 transition_recent_batches = 22;
  uint64 transition_small_batches = 23;
  uint64 transition_requeued = 24;
  uint64 transition_retry_pages = 25;
  uint64 transition_retry_windows = 26;
