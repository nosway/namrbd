syntax = "proto3";

package sbs.admin.v1;

option go_package = "github.com/nosway/namrbd/sbs/admin/v1;adminv1";

import "google/protobuf/timestamp.proto";
import "sbs/admin/v1/admin.proto";

service OperationsService {
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // GetOperationByRequestIdentity is a bounded identity lookup for a
  // previously accepted node drain. It is deliberately separate from the
  // legacy history-completing ListOperations RPC so a lost start response can
  // be recovered without reissuing the mutation.
  rpc GetOperationByRequestIdentity(GetOperationByRequestIdentityRequest) returns (GetOperationByRequestIdentityResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc ListOperationsPage(ListOperationsPageRequest) returns (ListOperationsPageResponse);
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_QUEUED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_COMPLETED = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELED = 5;
}

message OperationStatus {
  string operation_id = 1;
  string kind = 2;
  OperationState state = 3;
  string target_node_id = 4;
  string target_volume_id = 5;
  uint64 extents_remaining = 6;
  uint64 bytes_remaining = 7;
  string phase = 8;
  string blocking_reason = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp last_progress_at = 11;
  string error_message = 12;
  string actor = 13;
  string reason = 14;
  string approval_id = 15;
  bool risk_acknowledged = 16;
  bool follow_on_repair_required = 17;
  string request_id = 18;
}

message GetOperationRequest {
  ClusterRef cluster = 1;
  string operation_id = 2;
}

message GetOperationResponse {
  ClusterRef cluster = 1;
  OperationStatus operation = 2;
}

message GetOperationByRequestIdentityRequest {
  ClusterRef cluster = 1;
  string kind = 2;
  string target_node_id = 3;
  string request_id = 4;
}

message GetOperationByRequestIdentityResponse {
  ClusterRef cluster = 1;
  // found=false is an authoritative empty result for this exact identity.
  // The returned status is a durable operation record only; callers that need
  // current drain progress must follow with GetOperation(operation_id).
  bool found = 2;
  OperationStatus operation = 3;
}

message ListOperationsRequest {
  ClusterRef cluster = 1;
  string kind = 2;
  OperationState state = 3;
  ExpensiveCallAdmission admission = 4;
}

message ListOperationsResponse {
  ClusterRef cluster = 1;
  repeated OperationStatus operations = 2;
}

message ListOperationsPageRequest {
  ClusterRef cluster = 1;
  uint32 page_size = 2;
  string page_token = 3;
  string kind = 4;
  OperationState state = 5;
  google.protobuf.Timestamp updated_after = 6;
  google.protobuf.Timestamp updated_before = 7;
}

message ListOperationsPageResponse {
  ClusterRef cluster = 1;
  repeated OperationStatus operations = 2;
  string projection_revision = 3;
  string next_page_token = 4;
  int64 freshness_age_millis = 5;
  string projection_health = 6;
  uint32 scanned_records = 7;
  google.protobuf.Timestamp generated_at = 8;
}
