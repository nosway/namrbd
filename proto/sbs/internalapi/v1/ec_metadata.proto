syntax = "proto3";

package sbs.internalapi.v1;

option go_package = "github.com/nosway/namrbd/sbs/internalapi/v1;internalv1";

import "sbs/internalapi/v1/placement_apply.proto";
import "sbs/internalapi/v1/payload_encryption.proto";
import "sbs/internalapi/v1/write_session.proto";

service ECMetadataService {
  rpc GetPhysicalObject(GetPhysicalObjectRequest) returns (GetPhysicalObjectResponse);
  rpc PutPhysicalObject(PutPhysicalObjectRequest) returns (PutPhysicalObjectResponse);
  rpc GetECStripe(GetECStripeRequest) returns (GetECStripeResponse);
  rpc PutECStripe(PutECStripeRequest) returns (PutECStripeResponse);
  rpc CommitECFullStripeWrite(CommitECFullStripeWriteRequest) returns (CommitECFullStripeWriteResponse);
  rpc CommitECDiscard(CommitECDiscardRequest) returns (CommitECDiscardResponse);
}

message GetPhysicalObjectRequest {
  string volume_id = 1;
  string object_id = 2;
}

message GetPhysicalObjectResponse {
  PhysicalObject physical_object = 1;
}

message PutPhysicalObjectRequest {
  PhysicalObject physical_object = 1;
}

message PutPhysicalObjectResponse {}

message GetECStripeRequest {
  string volume_id = 1;
  string stripe_id = 2;
  uint64 stripe_generation = 3;
}

message GetECStripeResponse {
  ECStripe ec_stripe = 1;
}

message PutECStripeRequest {
  ECStripe ec_stripe = 1;
}

message PutECStripeResponse {}

message CommitECFullStripeWriteRequest {
  string volume_id = 1;
  uint64 expected_epoch = 2;
  uint64 expected_revision = 3;
  string idempotency_key = 4;
  uint64 committed_revision = 5;
  PhysicalObject physical_object = 6;
  ECStripe ec_stripe = 7;
  repeated AllocationPage allocation_pages = 8;
  string mutation_operation_id = 9;
  MutationOperationState expected_mutation_state = 10;
  repeated uint64 affected_page_nos = 11;
  repeated uint64 affected_extent_ids = 12;
  repeated uint64 retired_physical_chunk_ids = 13;
  repeated RetiredECObjectRef retired_ec_objects = 14;
  MutationOperationRecord mutation_operation = 15;
}

message CommitECFullStripeWriteResponse {
  VolumeState volume_state = 1;
  IdempotencyRecord idempotency_record = 2;
}

message CommitECDiscardRequest {
  string volume_id = 1;
  uint64 expected_epoch = 2;
  uint64 expected_revision = 3;
  string idempotency_key = 4;
  uint64 committed_revision = 5;
  repeated AllocationPage allocation_pages = 6;
  string mutation_operation_id = 7;
  MutationOperationState expected_mutation_state = 8;
  repeated uint64 affected_page_nos = 9;
  repeated uint64 affected_extent_ids = 10;
  repeated uint64 retired_physical_chunk_ids = 11;
  repeated RetiredECObjectRef retired_ec_objects = 12;
}

message CommitECDiscardResponse {
  VolumeState volume_state = 1;
  IdempotencyRecord idempotency_record = 2;
}

message RetiredECObjectRef {
  string object_id = 1;
  string stripe_id = 2;
  uint64 stripe_generation = 3;
}

message PhysicalObject {
  string volume_id = 1;
  string object_id = 2;
  string backend_type = 3;
  string placement_ref = 4;
  uint64 logical_length = 5;
  uint64 generation = 6;
  string checksum = 7;
  string state = 8;
  ReplicatedPhysicalObjectDescriptor replicated = 9;
  ECPhysicalObjectDescriptor ec = 10;
  int64 created_at_unix = 11;
  int64 updated_at_unix = 12;
  PayloadEncryptionHeader encryption = 13;
}

message ReplicatedPhysicalObjectDescriptor {
  uint64 physical_chunk_start = 1;
  uint32 chunk_count = 2;
}

message ECPhysicalObjectDescriptor {
  string profile_id = 1;
  string stripe_id = 2;
  uint64 stripe_generation = 3;
  uint32 stripe_unit_bytes = 4;
  uint32 data_shards = 5;
  uint32 coding_shards = 6;
  uint64 stripe_offset = 7;
  repeated string data_shard_refs = 8;
  repeated string code_shard_refs = 9;
}

message ECStripe {
  string volume_id = 1;
  string object_id = 2;
  string profile_id = 3;
  string stripe_id = 4;
  uint64 stripe_generation = 5;
  uint32 stripe_unit_bytes = 6;
  uint32 data_shards = 7;
  uint32 coding_shards = 8;
  uint64 topology_revision = 9;
  string state = 10;
  repeated ECShard shards = 11;
  int64 created_at_unix = 12;
  int64 updated_at_unix = 13;
}

message ECShard {
  uint32 shard_id = 1;
  string role = 2;
  uint32 role_index = 3;
  string zone = 4;
  string node_id = 5;
  string store_id = 6;
  string shard_object_id = 7;
  string checksum = 8;
  uint32 size_bytes = 9;
  PayloadEncryptionHeader encryption = 10;
}
