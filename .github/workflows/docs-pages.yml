name: Docs

# The manual set is render-checked from docs-src on every push to main. GitHub
# Pages deployment is an explicit workflow_dispatch action so a fresh public
# repository can pass CI before Pages has been enabled by an administrator.
# No rendered HTML is committed to the repository, so the Markdown sources
# cannot drift from what readers see.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the rendered documentation to GitHub Pages"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A superseded run has nothing worth finishing; the next one repeats the same
# render-check or explicit deploy path.
concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: python -m pip install -r docs-src/requirements.txt

      - name: Build and render-check the site
        run: make docs-render-check

  pages-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
    needs: render-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      can_deploy: ${{ steps.pages.outputs.can_deploy }}
    steps:
      - name: Check Pages deployment readiness
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/pages" || true)"

          if [ "$status" = "200" ]; then
            build_type="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("build_type") or "")' "$body")"
            if [ "$build_type" = "workflow" ]; then
              echo "can_deploy=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::GitHub Pages is enabled but is not configured with build_type=workflow. Set Pages source to GitHub Actions in repository settings, then rerun this workflow."
          else
            summary="$(tr '\n' ' ' <"$body" | cut -c 1-300)"
            echo "::warning::GitHub Pages deployment was requested, but Pages is not ready for workflow deployment (GET /pages HTTP ${status}). Enable Pages with source 'GitHub Actions' in repository settings, then rerun this workflow. Response: ${summary}"
          fi

          echo "can_deploy=false" >>"$GITHUB_OUTPUT"

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages && needs.pages-preflight.outputs.can_deploy == 'true' }}
    needs:
      - render-check
      - pages-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: python -m pip install -r docs-src/requirements.txt

      - name: Build and render-check the site
        run: make docs-render-check

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
