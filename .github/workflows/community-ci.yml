name: Community CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install MkDocs
        run: python -m pip install -r docs-src/requirements.txt

      - name: Format check
        run: make format-community-check

      - name: Build Community binaries
        run: make build-community

      - name: Test Community packages
        run: make test-community

      - name: Vet Community packages
        run: make vet-community

      - name: Public operations and docs gates
        run: |
          make observability-assets-check
          make docs-source-check
          make docs-render-check
          make web-operations-dashboard-test
          make quickstart-compose-config
          make kind-csi-pvc-demo-check
          CSI_HELM_REQUIRE_HELM=true make csi-helm-chart-check

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Govulncheck Community packages
        run: GOVULNCHECK="$(go env GOPATH)/bin/govulncheck" make govulncheck-community

  kernel-module:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential "linux-headers-$(uname -r)"

      - name: Build kernel module
        run: make kernel-module
