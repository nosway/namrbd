name: Community CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Install MkDocs
        run: python -m pip install -r docs-src/requirements.txt

      - name: Format check
        run: make format-community-check

      - name: Build Community binaries
        run: make build-community

      - name: Test Community packages
        run: make test-community

      - name: Vet Community packages
        run: make vet-community

      - name: Public operations and docs gates
        run: |
          make observability-assets-check
          make docs-source-check
          make docs-render-check
          make web-operations-dashboard-test
          make quickstart-compose-config
          make kind-csi-pvc-demo-check
          CSI_HELM_REQUIRE_HELM=true make csi-helm-chart-check

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Govulncheck Community packages
        run: GOVULNCHECK="$(go env GOPATH)/bin/govulncheck" make govulncheck-community

  kernel-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends build-essential "linux-headers-$(uname -r)"

      - name: Build kernel module
        run: make kernel-module

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
