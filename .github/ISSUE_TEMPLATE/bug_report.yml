name: Bug Report
description: Report a reproducible issue in the public NAMRBD platform.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, configuration, and observed output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, tag, or image digest.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, Kubernetes version, and storage backend details.
    validations:
      required: false
