name: Feature Request
description: Propose an improvement to the public NAMRBD platform.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should NAMRBD solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and the public component involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List workarounds or alternative designs you considered.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation idea
      description: How could the behavior be tested or observed?
    validations:
      required: false
