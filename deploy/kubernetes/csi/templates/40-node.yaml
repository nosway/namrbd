apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: namrbd-csi-node
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: namrbd-csi
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: namrbd-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: namrbd-csi
        app.kubernetes.io/component: node
      annotations:
        namrbd.io/admin-endpoint: "__ADMIN_ENDPOINT__"
        namrbd.io/admin-endpoints: "__ADMIN_ENDPOINTS__"
        namrbd.io/gateway-url: "__GATEWAY_URL__"
    spec:
      serviceAccountName: namrbd-csi-node
      hostNetwork: true
      containers:
        - name: namrbd-csi-driver
          image: __CSI_DRIVER_IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          args:
            - "--endpoint=unix:///csi/csi.sock"
            - "--admin-endpoint=$(NAMRBD_SBS_SERVICE_ENDPOINT)"
            - "--admin-endpoints=$(NAMRBD_SBS_SERVICE_ENDPOINTS)"
            - "--cluster-id=$(NAMRBD_CLUSTER_ID)"
            - "--sbs-cluster-id=$(NAMRBD_SBS_CLUSTER_ID)"
            - "--driver-name=$(NAMRBD_CSI_DRIVER_NAME)"
            - "--node-id=$(NODE_NAME)"
            - "--gateway-url=$(NAMRBD_GATEWAY_URL)"
            - "--namrbdctl=/usr/local/bin/namrbdctl"
          envFrom:
            - configMapRef:
                name: namrbd-csi-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMRBD_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: namrbd-csi-credentials
                  key: bearer-token
                  optional: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev-dir
              mountPath: /dev
            - name: sys-dir
              mountPath: /sys
            - name: modules-dir
              mountPath: /lib/modules
              readOnly: true
        - name: node-driver-registrar
          image: __CSI_NODE_DRIVER_REGISTRAR_IMAGE__
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/__DRIVER_NAME__/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: __CSI_LIVENESSPROBE_IMAGE__
          args:
            - "--csi-address=/csi/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/__DRIVER_NAME__
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: dev-dir
          hostPath:
            path: /dev
            type: Directory
        - name: sys-dir
          hostPath:
            path: /sys
            type: Directory
        - name: modules-dir
          hostPath:
            path: /lib/modules
            type: Directory
